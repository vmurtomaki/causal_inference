[project]
name = "causal_inference"
version = "0.1.0"
description = "Causal Inference and Price Elasticity Optimization via Double Machine Learning"
readme = "README.md"
requires-python = ">=3.12.4"
dependencies = [
    "doubleml>=0.11.3",
    "lightgbm>=4.6.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.59.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
# Extending with strict analysis boundaries
extend-select = ["E", "W", "F", "I", "UP", "B", "C4", "FA", "ISC", "SIM", "TID", "PTH", "TC", "S"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.mypy]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "pandas-stubs>=2.2.2",
]

[[tool.mypy.overrides]]
module = [
    "doubleml.*",
    "lightgbm.*",
]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]